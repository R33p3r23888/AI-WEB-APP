<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#12151A;
    --surface:#1B2028;
    --surface-2:#242B35;
    --text:#E8E6DE;
    --text-dim:#8B92A0;
    --accent:#5EC9B8;
    --accent-dim:#3E8F82;
    --border:#2A303B;
    --danger:#D9695F;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    height:100vh;
    overflow:hidden;
  }
  ::selection{background:var(--accent-dim); color:#fff;}

  .shell{
    display:flex;
    height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:270px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:18px 14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 4px 18px;
    margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    width:28px;height:28px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:14px;
    color:#0C1013;
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:.01em;
  }
  .new-chat-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .new-chat-btn:hover{border-color:var(--accent); background:#283040;}
  .new-chat-btn svg{width:15px;height:15px; flex-shrink:0;}

  .convo-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    margin:0 -4px;
    padding:0 4px;
  }
  .convo-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background .12s ease, color .12s ease;
    position:relative;
  }
  .convo-item:hover{background:var(--surface-2); color:var(--text);}
  .convo-item.active{background:var(--surface-2); color:var(--text); box-shadow:inset 2px 0 0 var(--accent);}
  .convo-item .convo-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .convo-del{
    opacity:0;
    background:none; border:none;
    color:var(--text-dim);
    cursor:pointer;
    padding:2px 4px;
    border-radius:4px;
    flex-shrink:0;
    font-size:14px;
    line-height:1;
  }
  .convo-item:hover .convo-del{opacity:1;}
  .convo-del:hover{color:var(--danger);}

  .sidebar-foot{
    padding-top:12px;
    margin-top:8px;
    border-top:1px solid var(--border);
    font-size:11px;
    color:var(--text-dim);
    line-height:1.5;
  }

  /* ---------- Main chat area ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .chat-scroll{
    flex:1;
    overflow-y:auto;
    padding:28px 0 8px;
  }
  .chat-inner{
    max-width:760px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .empty-hero{
    max-width:520px;
    margin:8vh auto 0;
    text-align:center;
    padding:0 20px;
  }
  .empty-hero .mark{
    width:52px;height:52px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:24px;
    color:#0C1013;
    margin:0 auto 18px;
  }
  .empty-hero h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 8px;
  }
  .empty-hero p{
    color:var(--text-dim);
    font-size:14px;
    line-height:1.6;
    margin:0 0 24px;
  }
  .suggestion-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .suggestion-card{
    text-align:left;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:12.5px;
    line-height:1.5;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .suggestion-card:hover{border-color:var(--accent); color:var(--text);}
  .suggestion-card b{display:block; color:var(--text); font-weight:600; margin-bottom:2px; font-size:13px;}

  .msg{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .msg-avatar{
    width:28px;height:28px;
    border-radius:8px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:12px;
    margin-top:2px;
  }
  .msg.user .msg-avatar{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}
  .msg.assistant .msg-avatar{background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:#0C1013;}

  .msg-body{
    flex:1;
    min-width:0;
    font-size:14.5px;
    line-height:1.7;
    padding-top:3px;
  }
  .msg.user .msg-body{color:var(--text);}
  .msg-body p{margin:0 0 12px;}
  .msg-body p:last-child{margin-bottom:0;}
  .msg-body ul, .msg-body ol{margin:0 0 12px; padding-left:22px;}
  .msg-body li{margin-bottom:4px;}
  .msg-body strong{color:var(--text); font-weight:600;}
  .msg-body a{color:var(--accent);}
  .msg-body code{
    background:var(--surface-2);
    padding:2px 5px;
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }

  .code-block{
    position:relative;
    margin:0 0 14px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
    background:#0E1115;
  }
  .code-block-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
  }
  .code-block-lang{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .code-block-actions{display:flex; gap:6px;}
  .code-btn{
    display:flex; align-items:center; gap:5px;
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:11px;
    padding:4px 8px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .code-btn:hover{border-color:var(--accent); color:var(--text);}
  .code-btn svg{width:11px;height:11px;}
  .code-block pre{
    margin:0;
    padding:14px 16px;
    overflow-x:auto;
  }
  .code-block code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    line-height:1.6;
    background:none;
    padding:0;
    color:#D8DEE9;
  }

  .msg-download{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .msg-download:hover{border-color:var(--accent); color:var(--text);}
  .msg-download svg{width:12px;height:12px;}

  .typing-dots{
    display:flex;
    gap:4px;
    padding-top:8px;
  }
  .typing-dots span{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--text-dim);
    animation:typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0); opacity:.4;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  .error-banner{
    background:rgba(217,105,95,0.1);
    border:1px solid rgba(217,105,95,0.3);
    color:var(--danger);
    padding:10px 14px;
    border-radius:8px;
    font-size:13px;
    line-height:1.5;
  }

  /* ---------- Composer ---------- */
  .composer-wrap{
    padding:14px 24px 22px;
  }
  .composer{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 10px 10px 16px;
    transition:border-color .15s ease;
  }
  .composer:focus-within{border-color:var(--accent);}
  .composer textarea{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    line-height:1.5;
    max-height:160px;
    padding:6px 0;
  }
  .composer textarea::placeholder{color:var(--text-dim);}
  .send-btn{
    width:34px;height:34px;
    border-radius:9px;
    border:none;
    background:var(--accent);
    color:#0C1013;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, opacity .15s ease;
  }
  .send-btn:hover{background:#78D8C9;}
  .send-btn:disabled{opacity:.4; cursor:default;}
  .send-btn svg{width:16px;height:16px;}
  .composer-hint{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:8px;
  }

  /* ---------- Mobile ---------- */
  .sidebar-toggle{
    display:none;
    position:fixed;
    top:14px; left:14px;
    z-index:50;
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  @media (max-width:760px){
    .sidebar-toggle{display:flex;}
    .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      z-index:40;
      transform:translateX(-100%);
      transition:transform .2s ease;
      box-shadow:0 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-scrim{
      display:none;
      position:fixed; inset:0;
      background:rgba(0,0,0,0.5);
      z-index:35;
    }
    .sidebar-scrim.show{display:block;}
    .chat-inner{padding:0 16px;}
    .composer-wrap{padding:10px 14px 16px;}
    .suggestion-grid{grid-template-columns:1fr;}
  }

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="sidebar-scrim" id="sidebarScrim"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">Atlas</div>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
    <div class="convo-list" id="convoList"></div>
    <div class="sidebar-foot">Chats are saved to this device's history.</div>
  </aside>

  <main class="main">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="empty-hero" id="emptyHero">
          <div class="mark">A</div>
          <h1>What can I help with?</h1>
          <p>Ask a question, brainstorm, or ask for a file — code, a document, or anything else — and I'll write it so you can download it.</p>
          <div class="suggestion-grid">
            <button class="suggestion-card" data-prompt="Write a Python script that renames every file in a folder to lowercase.">
              <b>Write a script</b>Rename files to lowercase in Python
            </button>
            <button class="suggestion-card" data-prompt="Draft a friendly follow-up email after a job interview.">
              <b>Draft an email</b>Friendly interview follow-up
            </button>
            <button class="suggestion-card" data-prompt="Explain how neural networks learn, in simple terms.">
              <b>Explain a concept</b>How neural networks learn
            </button>
            <button class="suggestion-card" data-prompt="Write a short README for a weather app project.">
              <b>Generate a document</b>README for a weather app
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <textarea id="messageInput" placeholder="Message Atlas…" rows="1"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </form>
      <div class="composer-hint">Atlas can make mistakes. Check important info.</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Device identity (no login — history scoped per browser) ---------- */
  var DEVICE_KEY = "atlasDeviceId";
  var deviceId = localStorage.getItem(DEVICE_KEY);
  if(!deviceId){
    deviceId = "dev_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(DEVICE_KEY, deviceId);
  }

  var sidebar = document.getElementById("sidebar");
  var sidebarToggle = document.getElementById("sidebarToggle");
  var sidebarScrim = document.getElementById("sidebarScrim");
  var convoList = document.getElementById("convoList");
  var newChatBtn = document.getElementById("newChatBtn");
  var chatScroll = document.getElementById("chatScroll");
  var chatInner = document.getElementById("chatInner");
  var emptyHero = document.getElementById("emptyHero");
  var composerForm = document.getElementById("composerForm");
  var messageInput = document.getElementById("messageInput");
  var sendBtn = document.getElementById("sendBtn");

  var currentConversationId = null;
  var currentMessages = []; // {role, content}
  var isSending = false;

  sidebarToggle.addEventListener("click", function(){
    sidebar.classList.toggle("open");
    sidebarScrim.classList.toggle("show");
  });
  sidebarScrim.addEventListener("click", function(){
    sidebar.classList.remove("open");
    sidebarScrim.classList.remove("show");
  });

  messageInput.addEventListener("input", function(){
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
    sendBtn.disabled = messageInput.value.trim().length === 0 || isSending;
  });
  messageInput.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      composerForm.requestSubmit();
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".suggestion-card"), function(card){
    card.addEventListener("click", function(){
      messageInput.value = card.getAttribute("data-prompt");
      messageInput.dispatchEvent(new Event("input"));
      composerForm.requestSubmit();
    });
  });

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  var EXT_BY_LANG = {
    python:"py", py:"py", javascript:"js", js:"js", typescript:"ts", ts:"ts",
    html:"html", css:"css", json:"json", bash:"sh", shell:"sh", sh:"sh",
    java:"java", c:"c", cpp:"cpp", "c++":"cpp", csharp:"cs", "c#":"cs",
    go:"go", rust:"rs", ruby:"rb", php:"php", sql:"sql", yaml:"yml", yml:"yml",
    markdown:"md", md:"md", text:"txt", plaintext:"txt"
  };

  function downloadText(filename, content){
    var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // Renders markdown, then enhances each code block with a language label and a download button.
  function renderMarkdown(container, text){
    container.innerHTML = marked.parse(text || "");
    var blocks = container.querySelectorAll("pre > code");
    Array.prototype.forEach.call(blocks, function(codeEl){
      var pre = codeEl.parentElement;
      var langMatch = (codeEl.className || "").match(/language-(\w+)/);
      var lang = langMatch ? langMatch[1] : "text";
      var ext = EXT_BY_LANG[lang.toLowerCase()] || "txt";

      var wrapper = document.createElement("div");
      wrapper.className = "code-block";
      var head = document.createElement("div");
      head.className = "code-block-head";
      head.innerHTML =
        '<span class="code-block-lang">' + escapeHtml(lang) + '</span>' +
        '<div class="code-block-actions">' +
          '<button type="button" class="code-btn copy-btn">Copy</button>' +
          '<button type="button" class="code-btn download-btn">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            'Download' +
          '</button>' +
        '</div>';

      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(head);
      wrapper.appendChild(pre);

      var codeText = codeEl.textContent;
      head.querySelector(".copy-btn").addEventListener("click", function(){
        navigator.clipboard.writeText(codeText).then(function(){
          var btn = head.querySelector(".copy-btn");
          var original = btn.textContent;
          btn.textContent = "Copied";
          setTimeout(function(){ btn.textContent = original; }, 1200);
        });
      });
      head.querySelector(".download-btn").addEventListener("click", function(){
        downloadText("atlas-file." + ext, codeText);
      });
    });
  }

  function addMessageToDOM(role, content){
    emptyHero.style.display = "none";
    var msg = document.createElement("div");
    msg.className = "msg " + role;

    var avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    avatar.textContent = role === "user" ? "You" : "A";

    var body = document.createElement("div");
    body.className = "msg-body";

    if(role === "assistant"){
      renderMarkdown(body, content);
      // Whole-response download, for non-code documents (essays, READMEs, etc.)
      var dl = document.createElement("button");
      dl.type = "button";
      dl.className = "msg-download";
      dl.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
        'Download response';
      dl.addEventListener("click", function(){
        downloadText("atlas-response.md", content);
      });
      body.appendChild(dl);
    } else {
      body.textContent = content;
    }

    msg.appendChild(avatar);
    msg.appendChild(body);
    chatInner.appendChild(msg);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    return { msg: msg, body: body };
  }

  function addTypingIndicator(){
    var msg = document.createElement("div");
    msg.className = "msg assistant";
    msg.id = "typingIndicator";
    msg.innerHTML =
      '<div class="msg-avatar">A</div>' +
      '<div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    chatInner.appendChild(msg);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }
  function removeTypingIndicator(){
    var el = document.getElementById("typingIndicator");
    if(el) el.remove();
  }

  function addErrorBanner(message){
    var div = document.createElement("div");
    div.className = "error-banner";
    div.textContent = message;
    chatInner.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function clearChat(){
    Array.prototype.slice.call(chatInner.children).forEach(function(child){
      if(child !== emptyHero) child.remove();
    });
    emptyHero.style.display = "block";
  }

  /* ---------- Conversations ---------- */
  function loadConversationList(){
    fetch("/api/conversations?deviceId=" + encodeURIComponent(deviceId))
      .then(function(res){ return res.json(); })
      .then(function(list){
        renderConvoList(Array.isArray(list) ? list : []);
      })
      .catch(function(){ /* sidebar list is non-critical; fail quietly */ });
  }

  function renderConvoList(list){
    convoList.innerHTML = "";
    list.forEach(function(c){
      var item = document.createElement("div");
      item.className = "convo-item" + (c.id === currentConversationId ? " active" : "");
      item.innerHTML =
        '<span class="convo-title">' + escapeHtml(c.title || "New chat") + '</span>' +
        '<button type="button" class="convo-del" aria-label="Delete chat">✕</button>';
      item.querySelector(".convo-title").addEventListener("click", function(){
        openConversation(c.id);
        sidebar.classList.remove("open");
        sidebarScrim.classList.remove("show");
      });
      item.querySelector(".convo-del").addEventListener("click", function(e){
        e.stopPropagation();
        if(!confirm("Delete this chat? This cannot be undone.")) return;
        fetch("/api/conversations?id=" + encodeURIComponent(c.id), { method: "DELETE" })
          .then(function(){
            if(c.id === currentConversationId) startNewChat();
            loadConversationList();
          });
      });
      convoList.appendChild(item);
    });
  }

  function openConversation(id){
    currentConversationId = id;
    clearChat();
    fetch("/api/conversations?deviceId=" + encodeURIComponent(deviceId) + "&id=" + encodeURIComponent(id))
      .then(function(res){ return res.json(); })
      .then(function(data){
        currentMessages = data.messages || [];
        if(currentMessages.length > 0) emptyHero.style.display = "none";
        currentMessages.forEach(function(m){ addMessageToDOM(m.role, m.content); });
        loadConversationList();
      })
      .catch(function(){
        addErrorBanner("Couldn't load this conversation. Please try again.");
      });
  }

  function startNewChat(){
    currentConversationId = null;
    currentMessages = [];
    clearChat();
    loadConversationList();
  }

  newChatBtn.addEventListener("click", startNewChat);

  function ensureConversation(){
    if(currentConversationId) return Promise.resolve(currentConversationId);
    return fetch("/api/conversations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deviceId: deviceId })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        currentConversationId = data.id;
        return currentConversationId;
      });
  }

  /* ---------- Sending messages ---------- */
  composerForm.addEventListener("submit", function(e){
    e.preventDefault();
    var text = messageInput.value.trim();
    if(!text || isSending) return;

    messageInput.value = "";
    messageInput.style.height = "auto";
    sendBtn.disabled = true;
    isSending = true;

    addMessageToDOM("user", text);
    currentMessages.push({ role: "user", content: text });
    addTypingIndicator();

    ensureConversation().then(function(convoId){
      return fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          conversationId: convoId,
          deviceId: deviceId,
          messages: currentMessages
        })
      });
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      removeTypingIndicator();
      if(!result.ok){
        addErrorBanner(result.data.error || "Something went wrong. Please try again.");
        return;
      }
      addMessageToDOM("assistant", result.data.reply);
      currentMessages.push({ role: "assistant", content: result.data.reply });
      loadConversationList();
    }).catch(function(){
      removeTypingIndicator();
      addErrorBanner("Couldn't reach the server. Check your connection and try again.");
    }).finally(function(){
      isSending = false;
      sendBtn.disabled = messageInput.value.trim().length === 0;
    });
  });

  loadConversationList();
})();
</script>
</body>
</html>
